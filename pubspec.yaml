name: raq_music
description: Berst (Raq Music) untuk iPhone, dibuat dengan Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  shared_preferences: ^2.2.3
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  video_player: ^2.9.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/about.mp4
